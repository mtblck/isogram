<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}} · isogram docs</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="https://getisogram.com{{path}}" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/bricolage.woff2" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top"><div class="wrap">
    <a class="mark" href="/" aria-label="isogram home">{{logo}}isogram</a>
    <nav aria-label="Site">
      <a href="/#examples">Examples</a>
      <a href="/#playground">Playground</a>
      <a href="/#install">Install</a>
      <a href="/docs/" aria-current="page">Docs</a>
      <a href="https://github.com/mtblck/isogram">GitHub</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div></header>
  <div class="docs wrap">
    <nav aria-label="Docs">{{nav}}</nav>
    <main id="main" class="prose">{{content}}</main>
  </div>
  <footer>
    <div class="wrap">
      <p>{{note}} <a href="https://github.com/mtblck/isogram/blob/main/{{source}}">Edit this page on GitHub</a>.</p>
    </div>
  </footer>
  <script src="/docs.js"></script>
</body>
</html>
